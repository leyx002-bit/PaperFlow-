/**
 * PAPERFLOW: private deal rooms for buying and selling across states.
 * Backend: Supabase (login, database, live updates). Every deal step runs
 * through a database function, so nobody can skip a step from the browser.
 * Telegram alerts are sent by the database, so no secret lives in this file.
 * You (the owner) sign in with an account marked is_admin and use
 * My > Admin desk to confirm payments and release money.
 */

// ---------- SET THESE ----------
const SUPABASE_URL = "https://bexxokaxumbfafngeiri.supabase.co";
const SUPABASE_KEY = "sb_publishable_i_0t_YDuEWP9J9vxvt2vFw_eOzqx-QA";  // publishable key: safe in the browser
// The account buyers pay into is stored in the database (app_config), not in this file.
const LOGIN_INBOX = "2colourdesign@gmail.com";   // YOUR real inbox. Each phone number logs in as yourname+phone@gmail.com behind the scenes; Gmail delivers those to you

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STORAGE_OK = (() => { try { localStorage.setItem("__pf", "1"); localStorage.removeItem("__pf"); return true; } catch (e) { return false; } })();
const fail = message => ({ error: { message } });
const baseUrl = () => location.origin + location.pathname;
const authEmail = phone => LOGIN_INBOX.split("@")[0] + "+" + phone + "@" + LOGIN_INBOX.split("@")[1];

function mapRoom(r, events, evidence, payout, refund) {
  const party = (id, name, phone) => id ? { id, name: name || ("User " + (phone || "").slice(-4)), phone } : null;
  return {
    code: r.code, kind: r.kind, title: r.title, desc: r.descr, price: Number(r.price), deadline: r.deadline || "",
    feePercent: r.fee_percent, status: r.status, creator: r.creator_id,
    buyer: party(r.buyer_id, r.buyer_name, r.buyer_phone), seller: party(r.seller_id, r.seller_name, r.seller_phone),
    ok: { buyer: r.buyer_ok, seller: r.seller_ok },
    sellerBank: payout ? { bankName: payout.bank_name, accountNumber: payout.account_number, accountName: payout.account_name } : null,
    buyerRefund: refund ? { bankName: refund.bank_name, accountNumber: refund.account_number, accountName: refund.account_name } : null,
    log: events.map(e => ({ t: e.created_at, text: e.text })),
    evidence: evidence.map(x => ({ who: x.who, text: x.text, t: x.created_at })),
  };
}
const groupBy = (rows, key) => rows.reduce((m, x) => { (m[x[key]] = m[x[key]] || []).push(x); return m; }, {});

const api = {
  async register(phone, password, email) {
    const { data, error } = await sb.auth.signUp({ email: authEmail(phone), password, options: { data: { phone, email } } });
    if (error) return fail(/already/i.test(error.message) ? "An account with this phone number already exists." : error.message);
    if (data.user && data.user.identities && data.user.identities.length === 0) return fail("An account with this phone number already exists.");
    if (data.session) return { user: data.user };
    const r = await sb.auth.signInWithPassword({ email: authEmail(phone), password });
    if (r.error) return fail("Account created, but login is blocked. In Supabase open Authentication > Sign In / Providers > Email and turn OFF 'Confirm email'.");
    return { user: r.data.user };
  },
  async login(phone, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email: authEmail(phone), password });
    if (error) return fail("Incorrect phone number or password.");
    return { user: data.user };
  },
  async logout() { await sb.auth.signOut(); },
  async fetchFullState(userId) {
    const [p, rooms, events, ev, pay, notes, ref] = await Promise.all([
      sb.from("profiles").select("*").eq("id", userId).single(),
      sb.from("rooms").select("*").order("updated_at", { ascending: false }),
      sb.from("room_events").select("room_code,text,created_at").order("id", { ascending: true }),
      sb.from("evidence").select("room_code,who,text,created_at").order("id", { ascending: true }),
      sb.from("room_payouts").select("*"),
      sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(100),
      sb.from("room_refunds").select("*"),
    ]);
    if (p.error || !p.data || rooms.error) return null;
    const evByRoom = groupBy(events.data || [], "room_code"), evidByRoom = groupBy(ev.data || [], "room_code");
    const payByRoom = {}; (pay.data || []).forEach(x => { payByRoom[x.room_code] = x; });
    const refByRoom = {}; (ref.data || []).forEach(x => { refByRoom[x.room_code] = x; });
    return {
      authed: true, userId, isAdmin: !!p.data.is_admin,
      profile: { name: p.data.name || "", email: p.data.email || "", phone: p.data.phone || "" },
      notifications: (notes.data || []).map(n => ({ id: n.id, text: n.text, at: n.created_at, read: n.read })).reverse(),
      rooms: rooms.data.map(r => mapRoom(r, evByRoom[r.code] || [], evidByRoom[r.code] || [], payByRoom[r.code], refByRoom[r.code])),
    };
  },
  async rpc(name, args) {
    const { data, error } = await sb.rpc(name, args);
    return error ? fail(error.message) : { data };
  },
  async createRoom(f) {
    const res = await api.rpc("create_room", { p_kind: f.kind, p_role: f.role, p_title: f.title, p_desc: f.desc, p_price: f.price, p_deadline: f.deadline || null });
    return res.error ? res : { code: res.data };
  },
  async updateProfile(userId, name, email) {
    const { error } = await sb.from("profiles").update({ name, email }).eq("id", userId);
    return error ? fail(error.message) : {};
  },
  async markAllRead(userId) { await sb.from("notifications").update({ read: true }).eq("user_id", userId).eq("read", false); },
};

  return { authed: false, userId: null, isAdmin: false, profile: { name: "", email: "", phone: "" }, notifications: [], rooms: [] };
}

function accountDisplayId(phone) {
  const digits = (phone || "").replace(/\D/g, "");
  return digits ? digits.slice(-8) : "\u2014";
}

function fmtDateLong(d) {
  return d.toLocaleDateString("en-NG", { day: "numeric", month: "long", year: "numeric" });

          <div className="pf-anim" style={{ position: "absolute", right: 14, top: "50%", marginTop: -60, animation: "pfFloat 4s ease-in-out infinite" }}><HeroArt kind={sl.art} /></div>
        </div>
      ))}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 8, display: "flex", justifyContent: "center", gap: 6, zIndex: 2 }}>
        {slides.map((sl, n) => (<button key={sl.key} onClick={e => { e.stopPropagation(); setIdx(n); }} aria-label={"Slide " + (n + 1)} style={{
          width: idx === n ? 18 : 6, height: 6, borderRadius: 3, border: "none", padding: 0, cursor: "pointer", background: idx === n ? "#fff" : "rgba(255,255,255,0.5)", transition: "width 0.3s" }} />))}
      </div>
    </div>
  );
}

function btnS(bg, extra) {
  const ghost = bg === "ghost";
  return { flex: 1, width: "100%", padding: "14px 0", borderRadius: 12, border: ghost ? `1px solid ${C.forest}` : "none",
    background: ghost ? "transparent" : bg, color: ghost ? C.forest : C.cream, fontSize: 15, fontWeight: 700, cursor: "pointer", marginTop: 8, ...extra };
}
const inpS = { width: "100%", padding: "13px 14px", border: `1px solid ${C.line}`, borderRadius: 12, fontSize: 15, background: C.paper, marginBottom: 10, color: C.ink, fontFamily: "inherit" };
const cardS = { background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: 16, marginBottom: 14 };

function CreateRoom({ onBack, onCreate }) {
  const [f, setF] = useState({ kind: "goods", role: "buyer", title: "", desc: "", price: "", deadline: "" });
  const set = k => e => setF({ ...f, [k]: e.target.value }), R = ROLE[f.kind], ok = f.title.trim().length > 2 && num(f.price) > 0;
  return (
    <div><TopBar title="New deal room" onBack={onBack} />
      <div style={{ padding: 18 }}>
        <select style={inpS} value={f.kind} onChange={set("kind")}><option value="goods">Buying / selling a physical item</option><option value="freelance">Freelance work</option></select>
        <select style={inpS} value={f.role} onChange={set("role")}><option value="buyer">I am the {R.buyer}</option><option value="seller">I am the {R.seller}</option></select>
        <input style={inpS} placeholder={f.kind === "goods" ? "Item (e.g. iPhone 13, used)" : "Job title"} value={f.title} onChange={set("title")} />
        <textarea style={{ ...inpS, minHeight: 90 }} placeholder={f.kind === "goods" ? "Condition, what is included, how it will be delivered" : "What work is required"} value={f.desc} onChange={set("desc")} />
        <input style={inpS} placeholder="Agreed price (\u20A6)" inputMode="numeric" value={f.price} onChange={set("price")} />
        <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 4 }}>{f.kind === "goods" ? "Delivery deadline" : "Deadline"}</div>
        <input style={inpS} type="date" value={f.deadline} onChange={set("deadline")} />
        <button disabled={!ok} style={btnS(ok ? C.forest : C.line, { color: ok ? C.cream : C.inkSoft })}
          onClick={() => onCreate({ ...f, title: f.title.trim(), desc: f.desc.trim(), price: num(f.price) })}>Create room and get code</button>
      </div></div>
  );
}

function JoinRoom({ onBack, onJoin }) {
  const [v, setV] = useState(""), [err, setErr] = useState(""), [busy, setBusy] = useState(false);
  async function go() {
    const code = v.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 6) { setErr("Enter the 6-character room code."); return; }
    setBusy(true); setErr("");
    const msg = await onJoin(code);
    setBusy(false);
    if (msg) setErr(msg);
  }
  return (
    <div><TopBar title="Join a deal room" onBack={onBack} />
      <div style={{ padding: 18 }}>
        <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 10, lineHeight: 1.5 }}>Type the 6-character room code the other person sent you.</div>
        <input style={{ ...inpS, letterSpacing: 6, fontSize: 22, textAlign: "center", textTransform: "uppercase" }} maxLength={6} placeholder="ABC123" value={v} onChange={e => { setV(e.target.value); setErr(""); }} />
        {err && <div style={{ color: "#B8392A", fontSize: 13 }}>{err}</div>}
        <button style={btnS(C.forest, busy ? { opacity: 0.6 } : undefined)} disabled={busy} onClick={go}>Join</button>
      </div></div>
  );
}

function PayPopup({ r, onClose, onClaim }) {
  const [copied, setCopied] = useState(""), [acct, setAcct] = useState(null), [err, setErr] = useState(""), [busy, setBusy] = useState(false);
  React.useEffect(() => {
    let on = true;
    api.rpc("get_pay_account", { p_code: r.code }).then(res => { if (!on) return; if (res.error) setErr(res.error.message); else setAcct(res.data); });
    return () => { on = false; };
  }, [r.code]);
  const Row = ({ label, value }) => (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 0", borderBottom: `1px solid ${C.line}` }}>
      <div><div style={{ fontSize: 11, color: C.inkSoft }}>{label}</div><div style={{ fontFamily: "Georgia, serif", fontSize: 16, color: C.ink, marginTop: 2 }}>{value}</div></div>
      <button onClick={() => { try { navigator.clipboard.writeText(String(value)); } catch (e) {} setCopied(label); setTimeout(() => setCopied(""), 1400); }} style={{
        background: C.cream, border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 600, color: C.forest, cursor: "pointer" }}>{copied === label ? "Copied" : "Copy"}</button>
    </div>);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50, background: "rgba(0,0,0,0.55)", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <style>{`@keyframes pfSheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}`}</style>
      <div onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: 420, maxHeight: "92vh", overflowY: "auto", background: C.cream, borderRadius: "20px 20px 0 0", padding: "10px 18px 22px", animation: "pfSheet 0.25s ease-out" }}>
        <div style={{ width: 40, height: 4, borderRadius: 2, background: C.line, margin: "0 auto 12px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 17 }}>Pay into the PaperFlow account</div>
          <button onClick={onClose} aria-label="Close" style={{ background: "none", border: "none", fontSize: 24, color: C.inkSoft, cursor: "pointer" }}>&times;</button></div>
        <div style={{ background: `linear-gradient(125deg, ${C.forestDeep}, ${C.forest})`, color: C.cream, borderRadius: 14, padding: 18, marginBottom: 16 }}>
          <div style={{ fontSize: 12, opacity: 0.75 }}>Amount to transfer (exactly this amount)</div><div style={{ fontFamily: "Georgia, serif", fontSize: 28, marginTop: 4 }}>{fmt(r.price)}</div></div>
        <div style={{ border: `1px solid ${C.line}`, borderRadius: 12, padding: "4px 14px", marginBottom: 14, background: C.paper }}>
          {acct ? <><Row label="Bank" value={acct.bank} /><Row label="Account number" value={acct.number} /><Row label="Account name" value={acct.name} /><Row label="Narration" value={r.code} /></> : <div style={{ padding: "14px 0", fontSize: 13, color: C.inkSoft }}>{err || "Loading account details..."}</div>}</div>
        <div style={{ fontSize: 12, color: C.inkSoft, lineHeight: 1.6, marginBottom: 12 }}>Put <b>{r.code}</b> in the narration. The seller is only told to ship after PaperFlow confirms the money in the bank, so your tap below is not proof of payment.</div>
        <button disabled={!acct || busy} onClick={async () => { setBusy(true); await onClaim(r); setBusy(false); }} style={btnS(C.clay, (!acct || busy) ? { opacity: 0.6 } : undefined)}>I've made the payment</button>
      </div></div>
  );
}

function Room({ r, me, onBack, act, admin, showPay, toast }) {
  const [text, setText] = useState(""), [track, setTrack] = useState(""), [terms, setTerms] = useState(null), [busy, setBusy] = useState(false);
  const [bank, setBank] = useState({ bankName: "", accountNumber: "", accountName: "" });
  const [rf, setRf] = useState({ bankName: "", accountNumber: "", accountName: "" });
  const mine = r.buyer && r.buyer.id === me ? "buyer" : r.seller && r.seller.id === me ? "seller" : null;
  const R = ROLE[r.kind], fee = r.price * r.feePercent / 100, payout = r.price - fee;
  async function call(name, args, msg) {
    if (busy) return false;
    setBusy(true);
    try { return await act(name, { p_code: r.code, ...args }, msg); } finally { setBusy(false); }
  }
  const accept = () => call("accept_terms", {}, "You accepted the terms");
  const saveTerms = async () => {
    if (await call("update_terms", { p_title: terms.title, p_desc: terms.desc, p_price: num(terms.price) || r.price, p_deadline: terms.deadline || null }, "Terms updated")) setTerms(null);
  };
  const addEvidence = async () => {
    if (text.trim().length < 2) return;
    if (await call("add_evidence", { p_text: text.trim() }, "Evidence added")) setText("");
  };
  const share = () => {
    const msg = "Join my PaperFlow deal. Room code: " + r.code + "\n" + baseUrl() + "#join=" + r.code;
    if (navigator.share) navigator.share({ text: msg }).catch(() => {});
    else { try { navigator.clipboard.writeText(msg); } catch (e) {} toast("Room code copied. Send it to the other person."); }
  };
  const B = (label, fn, bg = C.forest) => <button style={btnS(bg, busy ? { opacity: 0.6 } : undefined)} disabled={busy} onClick={fn}>{label}</button>;
  const sm = { fontSize: 12, color: C.inkSoft };
  return (
    <div><TopBar title={r.title} onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ ...cardS, background: C.forest, color: C.cream, border: "none" }}><div style={{ fontSize: 12, opacity: 0.8 }}>Room {r.code}</div><div style={{ fontSize: 18, fontFamily: "Georgia, serif" }}>{STATUS[r.status]}</div></div>
        <div style={cardS}>
          <div style={sm}>{R.buyer}: {r.buyer ? r.buyer.name : "waiting..."} &middot; {R.seller}: {r.seller ? r.seller.name : "waiting..."}{mine ? ` (you are the ${R[mine]})` : ""}</div>
          {terms ? (<>
            <input style={{ ...inpS, marginTop: 10 }} value={terms.title} onChange={e => setTerms({ ...terms, title: e.target.value })} />
            <textarea style={{ ...inpS, minHeight: 80 }} value={terms.desc} onChange={e => setTerms({ ...terms, desc: e.target.value })} />
            <input style={inpS} inputMode="numeric" value={terms.price} onChange={e => setTerms({ ...terms, price: e.target.value })} />
            <input style={inpS} type="date" value={terms.deadline || ""} onChange={e => setTerms({ ...terms, deadline: e.target.value })} />{B("Save terms", saveTerms)}</>) : (<>
            <div style={{ fontSize: 26, fontFamily: "Georgia, serif", margin: "10px 0 4px" }}>{fmt(r.price)}</div>
            <div style={{ fontSize: 14, whiteSpace: "pre-wrap", color: C.ink }}>{r.desc || "No description yet."}</div>
            <div style={{ ...sm, marginTop: 8 }}>Deadline: {r.deadline || "not set"}. The {r.feePercent}% fee ({fmt(fee)}) comes out of the seller's payout, so the seller receives {fmt(payout)}.</div>
            {mine && ["open", "negotiating"].includes(r.status) && <button style={btnS("ghost")} onClick={() => setTerms({ title: r.title, desc: r.desc, price: r.price, deadline: r.deadline })}>Edit terms</button>}
            {mine && r.status === "negotiating" && !r.ok[mine] && B("I accept these terms", accept, C.clay)}
            {mine && r.status === "negotiating" && r.ok[mine] && <div style={{ ...sm, marginTop: 8 }}>You accepted. Waiting for the other party.</div>}</>)}
        </div>
        {r.status === "open" && mine && <div style={cardS}><div style={sm}>Room code</div><div style={{ fontSize: 30, letterSpacing: 6, fontFamily: "Georgia, serif", margin: "6px 0" }}>{r.code}</div>
          <div style={sm}>Send this code to the other person. They open PaperFlow, tap Join Deal and type it in.</div>{B("Share room code", share, "ghost")}</div>}
        {mine === "buyer" && r.status === "agreed" && B("Pay now", showPay, C.clay)}
        {mine === "buyer" && r.status === "payment_claimed" && <div style={{ ...sm, marginBottom: 10 }}>We are confirming your payment in the bank. This page updates by itself.</div>}
        {mine === "buyer" && ["agreed", "payment_claimed", "funded", "shipped", "disputed"].includes(r.status) && !r.buyerRefund && <div style={cardS}>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 15, marginBottom: 4 }}>Refund account (optional)</div>
          <div style={{ ...sm, marginBottom: 8 }}>If the deal is cancelled or goes wrong, your money is sent back here. Add it now so a refund is not delayed.</div>
          <input style={inpS} placeholder="Bank name" value={rf.bankName} onChange={e => setRf({ ...rf, bankName: e.target.value })} />
          <input style={inpS} inputMode="numeric" placeholder="Account number (10 digits)" value={rf.accountNumber} onChange={e => setRf({ ...rf, accountNumber: e.target.value.replace(/[^0-9]/g, "").slice(0, 10) })} />
          <input style={inpS} placeholder="Account name" value={rf.accountName} onChange={e => setRf({ ...rf, accountName: e.target.value })} />
          {B("Save refund account", () => {
            if (rf.bankName.trim().length < 2 || rf.accountNumber.length !== 10 || rf.accountName.trim().length < 3) { toast("Enter the bank, a 10-digit account number and the account name."); return; }
            call("save_refund_account", { p_bank: rf.bankName.trim(), p_account: rf.accountNumber, p_name: rf.accountName.trim() }, "Refund account saved");
          }, "ghost")}</div>}
        {mine === "buyer" && r.buyerRefund && !["released", "cancelled", "refunded"].includes(r.status) && <div style={{ ...sm, marginBottom: 10 }}>Refund account: {r.buyerRefund.bankName} {r.buyerRefund.accountNumber}</div>}
        {mine === "seller" && ["agreed", "payment_claimed"].includes(r.status) && <div style={{ ...sm, marginBottom: 10 }}>Waiting for the buyer's payment to be confirmed. Do not ship yet.</div>}
        {mine === "seller" && ["agreed", "payment_claimed", "funded", "shipped", "received"].includes(r.status) && !r.sellerBank && <div style={cardS}>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 15, marginBottom: 4 }}>Where should we pay you?</div>
          <div style={{ ...sm, marginBottom: 8 }}>Add your bank details now. This is where your payout goes after the buyer confirms. Double-check the account number.</div>
          <input style={inpS} placeholder="Bank name" value={bank.bankName} onChange={e => setBank({ ...bank, bankName: e.target.value })} />
          <input style={inpS} inputMode="numeric" placeholder="Account number (10 digits)" value={bank.accountNumber} onChange={e => setBank({ ...bank, accountNumber: e.target.value.replace(/[^0-9]/g, "").slice(0, 10) })} />
          <input style={inpS} placeholder="Account name" value={bank.accountName} onChange={e => setBank({ ...bank, accountName: e.target.value })} />
          {B("Save payout details", () => {
            if (bank.bankName.trim().length < 2 || bank.accountNumber.length !== 10 || bank.accountName.trim().length < 3) { toast("Enter the bank, a 10-digit account number and the account name."); return; }
            call("save_payout", { p_bank: bank.bankName.trim(), p_account: bank.accountNumber, p_name: bank.accountName.trim() }, "Payout details saved");
          })}</div>}
        {mine === "seller" && r.sellerBank && !["released", "cancelled", "refunded"].includes(r.status) && <div style={{ ...sm, marginBottom: 10 }}>Payout to: {r.sellerBank.bankName} {r.sellerBank.accountNumber}</div>}
        {mine === "seller" && r.status === "funded" && !r.sellerBank && <div style={{ ...sm, marginBottom: 10 }}>Add your payout details above before you ship.</div>}
        {mine === "seller" && r.status === "funded" && r.sellerBank && <div style={cardS}><div style={{ ...sm, marginBottom: 8 }}>Payment confirmed. You can ship now.</div><input style={inpS} placeholder="Tracking / delivery details (optional)" value={track} onChange={e => setTrack(e.target.value)} />
          {B(r.kind === "goods" ? "I have shipped the item" : "I have submitted the work", async () => { if (await call("mark_shipped", { p_note: track }, "Marked as delivered")) setTrack(""); })}</div>}
        {mine === "buyer" && r.status === "shipped" && B(r.kind === "goods" ? "I received it, release the money" : "Accept the work, release the money", () => call("confirm_received", {}, "Thanks. PaperFlow will pay the seller."))}
        {mine && ["funded", "shipped"].includes(r.status) && <button style={btnS("ghost")} disabled={busy} onClick={() => call("report_problem", {}, "Problem reported")}>Report a problem</button>}
        {mine && ["open", "negotiating"].includes(r.status) && r.creator === me && <button style={btnS("ghost")} disabled={busy} onClick={() => call("cancel_room", {}, "Room cancelled")}>Cancel room</button>}
        {(mine || admin) && !["open", "cancelled"].includes(r.status) && <div style={{ ...cardS, marginTop: 14 }}><div style={{ fontFamily: "Georgia, serif", fontSize: 15, marginBottom: 6 }}>Evidence and notes</div>
          {r.evidence.length === 0 && <div style={sm}>Nothing added yet.</div>}
          {r.evidence.map((x, i) => <div key={i} style={{ fontSize: 13, padding: "8px 0", borderBottom: `1px solid ${C.line}` }}><b>{x.who}</b>: {x.text}<div style={sm}>{fmtT(x.t)}</div></div>)}
          {mine && <><textarea style={{ ...inpS, minHeight: 60, marginTop: 10 }} placeholder="Message, link or description of your evidence" value={text} onChange={e => setText(e.target.value)} />{B("Submit evidence", addEvidence)}</>}</div>}
        {admin && <div style={{ ...cardS, border: `2px solid ${C.clay}` }}><div style={{ fontFamily: "Georgia, serif", fontSize: 15 }}>Admin actions</div>
          <div style={{ fontSize: 13, margin: "8px 0", lineHeight: 1.6, color: C.ink }}>{r.sellerBank ? <>Pay the seller <b>{fmt(payout)}</b> to:<br />{r.sellerBank.bankName}<br /><b>{r.sellerBank.accountNumber}</b><br />{r.sellerBank.accountName}</> : "The seller has not added payout details yet."}</div>
          {r.status === "payment_claimed" && <div style={{ fontSize: 13, margin: "8px 0", lineHeight: 1.6, color: C.ink }}>Before you confirm, check your bank shows exactly <b>{fmt(r.price)}</b> with narration <b>{r.code}</b>.</div>}
          {r.status === "payment_claimed" && B("Payment confirmed in my bank", () => call("admin_confirm_payment", {}, "Payment confirmed. Seller can ship."), C.clay)}
          {r.status === "payment_claimed" && B("Money did not arrive", () => call("admin_reject_payment", {}, "Sent back to the buyer"), "ghost")}
          {["disputed", "funded", "shipped"].includes(r.status) && <div style={{ fontSize: 13, margin: "8px 0", lineHeight: 1.6, color: C.ink }}>{r.buyerRefund ? <>If you refund, send <b>{fmt(r.price)}</b> to:<br />{r.buyerRefund.bankName}<br /><b>{r.buyerRefund.accountNumber}</b><br />{r.buyerRefund.accountName}</> : "The buyer has not added refund details. Call " + (r.buyer ? r.buyer.phone : "them") + " before refunding."}</div>}
          {["received", "disputed"].includes(r.status) && B("I have paid the seller " + fmt(payout), () => call("admin_release", {}, "Marked as released"), C.clay)}
          {r.status === "disputed" && B("I have refunded the buyer", () => call("admin_refund", {}, "Marked as refunded"), C.clay)}
          <div style={{ ...sm, marginTop: 6 }}>Both phones update by themselves after each action.</div></div>}
        <div style={{ ...cardS, marginTop: 14 }}><div style={{ fontFamily: "Georgia, serif", fontSize: 15, marginBottom: 6 }}>Progress</div>
          {[...r.log].reverse().map((x, i) => <div key={i} style={{ fontSize: 13, padding: "6px 0", color: C.ink }}>{x.text}<div style={sm}>{fmtT(x.t)}</div></div>)}</div>
      </div></div>
  );
}

function AdminDesk({ onBack, onOpen, rooms }) {
  const [filter, setFilter] = useState("todo");
  const todo = rooms.filter(r => ["payment_claimed", "received", "disputed"].includes(r.status));
  const list = filter === "todo" ? todo : rooms;
  return (
    <div><TopBar title="Admin desk" onBack={onBack} />
      <div style={{ padding: 14 }}>
        <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          <button onClick={() => setFilter("todo")} style={btnS(filter === "todo" ? C.forest : "ghost")}>Needs action ({todo.length})</button>
          <button onClick={() => setFilter("all")} style={btnS(filter === "all" ? C.forest : "ghost")}>All rooms ({rooms.length})</button>

// ---------- PHOTO SLIDESHOW (reusable) ----------
// Cycles through whatever image filenames are passed in, wherever a
// brand mark or game banner would otherwise be a plain icon/gradient.
// Any filename that 404s is skipped silently and never retried, so
// dropping in 1, 2, or 3 real photos just works — no placeholders
// needed for the rest. Falls back to an icon if none of the images
// are present yet.
function ImageSlide({ images, size = 64, intervalMs = 5000, cover = false, fallbackIcon = "leaf" }) {
  const [index, setIndex] = useState(0);
  const [failedAll, setFailedAll] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const failedSet = React.useRef(new Set());

  React.useEffect(() => {
    if (failedAll || images.length <= 1) return;
    const t = setInterval(() => {
      setIndex(i => {
        let next = (i + 1) % images.length;
        // skip over any slide already known to be missing
        let tries = 0;
        while (failedSet.current.has(next) && tries < images.length) {
          next = (next + 1) % images.length;
          tries++;
        }
        return next;
      });
    }, intervalMs);
    return () => clearInterval(t);
  }, [failedAll, intervalMs, images]);

  // Auto-return to the slideshow 10 seconds after opening fullscreen.
  React.useEffect(() => {
    if (!fullscreen) return;
    const t = setTimeout(() => setFullscreen(false), 10000);
    return () => clearTimeout(t);
  }, [fullscreen]);

  function handleError() {
    failedSet.current.add(index);
    if (failedSet.current.size >= images.length) {
      setFailedAll(true);
      return;
    }
    setIndex(i => (i + 1) % images.length);
  }

  if (!images.length || failedAll) {
    return <Icon name={fallbackIcon} size={size * 0.75} color={C.cream} strokeWidth={1.3} />;
  }

  const imgEl = (
    <img
      key={images[index]}
      src={images[index]}
      alt=""
      onError={handleError}
      onClick={cover ? () => setFullscreen(true) : undefined}
      style={cover
        ? { width: "100%", height: "100%", objectFit: "cover", cursor: "pointer" }
        : { width: size, height: size, objectFit: "contain", borderRadius: size * 0.18 }}
    />
  );

  if (!fullscreen) return imgEl;

  return (
    <div onClick={() => setFullscreen(false)} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)", zIndex: 999,
      display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
    }}>
      <img src={images[index]} alt="" style={{ maxWidth: "92%", maxHeight: "80%", objectFit: "contain" }} />
    </div>
  );
}

// Brand-mark image — used on the Auth (login/register) header banner.
// Drop a file named image.png next to this HTML file and it appears
// automatically; if it's missing, the leaf icon is the fallback so the

const LOGO_SLIDES = ["image.png"];

function LogoSlide({ size = 64, intervalMs = 5000, cover = false }) {

// ---------- CAPTCHA ----------
// A drawn, scrambled-character challenge \u2014 the person must type what
// they see before registering. This is a basic bot deterrent, not real
// security (anyone reading the page source can see the answer in
// React state) \u2014 it stops simple automated signup spam, not a
// determined attacker. Canvas-drawn so the code can't be selected/
// copy-pasted as plain text the way a plain <div> of characters could be.
const CAPTCHA_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion

function generateCaptchaCode(length = 5) {
  let code = "";
  for (let i = 0; i < length; i++) {
    code += CAPTCHA_CHARS[Math.floor(Math.random() * CAPTCHA_CHARS.length)];
  }
  return code;
}

function Captcha({ code, onRefresh }) {
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#F6F2EA";
    ctx.fillRect(0, 0, w, h);

    // noise lines
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(27, 58, 43, ${0.12 + Math.random() * 0.15})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.random() * w, Math.random() * h);
      ctx.lineTo(Math.random() * w, Math.random() * h);
      ctx.stroke();
    }

    // scattered dots
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `rgba(107, 107, 99, ${0.15 + Math.random() * 0.2})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    // each character, rotated and offset a bit
    const charWidth = w / code.length;
    for (let i = 0; i < code.length; i++) {
      ctx.save();
      const cx = charWidth * i + charWidth / 2;
      const cy = h / 2 + (Math.random() * 10 - 5);
      ctx.translate(cx, cy);
      ctx.rotate((Math.random() * 0.5 - 0.25));
      ctx.font = "bold 26px Georgia, serif";
      ctx.fillStyle = ["#1B3A2B", "#11271C", "#C9703D"][i % 3];
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(code[i], 0, 0);
      ctx.restore();
    }
  }, [code]);

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
      <canvas ref={canvasRef} width={160} height={50} style={{
        borderRadius: 8, border: `1px solid ${C.line}`, display: "block",
      }} />
      <button type="button" onClick={onRefresh} style={{
        border: `1px solid ${C.line}`, background: C.paper, borderRadius: 8,
        width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "pointer", flexShrink: 0,
      }} aria-label="Refresh captcha">
        <Icon name="refresh" size={16} color={C.inkSoft} />
      </button>
    </div>
  );
}

function normalizePhone(phone) {
  return phone.replace(/\D/g, "");

// General international phone check (not Nigeria-specific): after
// stripping everything but digits, a real phone number is 7\u201315 digits
// long \u2014 the E.164 range every country's numbers fall within.
function isValidPhone(normPhone) {
  return /^\d{7,15}$/.test(normPhone);
}

function Auth({ mode, setMode, onLogin }) {
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [captchaCode, setCaptchaCode] = useState(() => generateCaptchaCode());
  const [captchaInput, setCaptchaInput] = useState("");
  const [error, setError] = useState("");

  function refreshCaptcha() {
    setCaptchaCode(generateCaptchaCode());
    setCaptchaInput("");
  }

  function resetFormError() {
    if (error) setError("");
  }

  async function submit() {
    const normPhone = normalizePhone(phone);
    if (!isValidPhone(normPhone)) {
      setError("Enter a valid phone number.");
      return;
    }
    if (mode === "register" && !/^\S+@\S+\.\S+$/.test(email.trim())) {
      setError("Enter a valid email address.");
      return;
    }
    if (password.length < 6) {
      setError("Password must be at least 6 characters.");
      return;
    }
    if (mode === "register" && captchaInput.trim().toUpperCase() !== captchaCode) {
      setError("The code you entered doesn\u2019t match the image.");
      refreshCaptcha();
      return;
    }

    setError("");
    if (mode === "register") {
      const result = await registerAccount(phone, password, email.trim());
      if (!result.ok) {
        setError(result.error);
        refreshCaptcha();
        return;
      }
      onLogin();
    } else {
      const result = await checkLogin(phone, password);
      if (!result.ok) {
        setError(result.error);
        refreshCaptcha();
        return;
      }
      onLogin();
    }

  return (

    const { data } = sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") setStore(defaultState()); });
    return () => data.subscription.unsubscribe();
  }, []);

  // live updates: any change to this user's rooms refreshes the screen
  React.useEffect(() => {
    if (!store.authed) return;
    let t = null;
    const kick = () => { clearTimeout(t); t = setTimeout(refresh, 400); };
    const ch = sb.channel("pf-live");
    ["rooms", "room_events", "evidence", "room_payouts", "notifications"].forEach(tb => ch.on("postgres_changes", { event: "*", schema: "public", table: tb }, kick));
    ch.subscribe();
    const poll = setInterval(refresh, 20000);
    return () => { clearTimeout(t); clearInterval(poll); sb.removeChannel(ch); };
  }, [store.authed]);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2600); }

  async function act(name, args, okMsg) {
    const res = await api.rpc(name, args);
    if (res.error) { showToast(res.error.message); await refresh(); return false; }
    await refresh();
    if (okMsg) showToast(okMsg);
    return true;
  }

  async function doJoin(code) {
    const res = await api.rpc("join_room", { p_code: code });
    if (res.error) return res.error.message;
    await refresh(); setTab("deals"); setFromAdmin(false); setScreen({ room: res.data });
    return null;
  }

  // links like yoursite/#join=ABC123 open the join straight away after login
  React.useEffect(() => {
    if (!store.authed) return;
    const m = location.hash.match(/^#join=([A-Za-z0-9]{6})$/);
    if (!m) return;
    history.replaceState(null, "", baseUrl());
    doJoin(m[1].toUpperCase()).then(msg => { if (msg) showToast(msg); });
  }, [store.authed]);

  function handleNav(to) {
    if (to === "logout") { setConfirmingLogout(true); return; }
    if (to === "deals") { setScreen(null); setTab("deals"); return; }
    setScreen(to);
  }

  if (checkingSession) return <Shell><div style={{ flex: 1 }} /></Shell>;
  if (!store.authed) return <Shell><Auth mode={authMode} setMode={setAuthMode} onLogin={refresh} /></Shell>;

  const myRooms = store.rooms.filter(x => (x.buyer && x.buyer.id === store.userId) || (x.seller && x.seller.id === store.userId));
  const openRoom = code => { setFromAdmin(false); setScreen({ room: code }); };
  const openFromAdmin = code => { setFromAdmin(true); setScreen({ room: code }); };
  const room = screen && screen.room ? store.rooms.find(x => x.code === screen.room) : null;
  let body;
  if (confirmingLogout) {
    body = (
      <div style={{ padding: 24 }}>
        <TopBar title="Log out" onBack={() => setConfirmingLogout(false)} />
        <div style={{ padding: "30px 4px", textAlign: "center" }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><IconBadge name="power" size={52} iconSize={24} bg="#FBEAE7" fg="#B8392A" /></div>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 17, color: C.ink, marginBottom: 22 }}>Log out of PaperFlow?</div>
          <button onClick={async () => { await signOutAccount(); setStore(defaultState()); setConfirmingLogout(false); setScreen(null); setTab("home"); setFromAdmin(false); }} style={{
            width: "100%", padding: "14px 0", borderRadius: 12, border: "none", background: "#B8392A", color: C.cream, fontSize: 15, fontWeight: 700, cursor: "pointer", marginBottom: 10 }}>Log out</button>
          <button onClick={() => setConfirmingLogout(false)} style={{ width: "100%", padding: "14px 0", borderRadius: 12, border: `1px solid ${C.line}`, background: "none", color: C.ink, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
        </div>
      </div>);
  } else if (screen === "create") {
    body = <CreateRoom onBack={() => setScreen(null)} onCreate={async f => {
      const res = await api.createRoom(f);
      if (res.error) { showToast(res.error.message); return; }
      await refresh(); openRoom(res.code);
    }} />;
  } else if (screen === "join") {
    body = <JoinRoom onBack={() => setScreen(null)} onJoin={doJoin} />;
  } else if (screen === "admin" && store.isAdmin) {
    body = <AdminDesk onBack={() => setScreen(null)} onOpen={openFromAdmin} rooms={store.rooms} />;
  } else if (room) {
    body = <Room r={room} me={store.userId} admin={store.isAdmin} toast={showToast} showPay={() => setPayCode(room.code)}
      onBack={() => setScreen(fromAdmin ? "admin" : null)} act={act} />;
  } else if (screen === "how") {
    body = <HowPage onBack={() => setScreen(null)} />;
  } else if (screen === "personal") {
    body = <PersonalPage profile={store.profile} onBack={() => setScreen(null)}
      onSave={async (profile) => {
        const { error } = await api.updateProfile(store.userId, profile.name, profile.email);
        if (error) { showToast(error.message || "Couldn't save"); return; }
        await refresh(); showToast("Personal details saved");
      }} />;
  } else if (screen === "message") {
    body = <MessagesPage notifications={store.notifications} onBack={() => setScreen(null)}
      onMarkAllRead={async () => { await api.markAllRead(store.userId); await refresh(); }} />;
  } else if (screen === "about") {
    body = <AboutPage onBack={() => setScreen(null)} />;
  } else if (screen && SIMPLE_PAGES[screen]) {
    const pg = SIMPLE_PAGES[screen];
    body = <Simple title={pg.title} icon={pg.icon} onBack={() => setScreen(null)}>{pg.body}</Simple>;
  } else {
    if (tab === "home") body = <Home onNav={handleNav} rooms={myRooms} onOpen={openRoom} />;
    else if (tab === "deals") body = <DealsTab onNav={handleNav} rooms={myRooms} onOpen={openRoom} />;
    else if (tab === "my") body = <MyPage userId={accountDisplayId(store.profile.phone)} phone={store.profile.phone || "Not set"} onNav={handleNav}
      isAdmin={store.isAdmin} unreadCount={store.notifications.filter(n => !n.read).length} />;
  }
  const payRoom = payCode ? store.rooms.find(x => x.code === payCode) : null;

  return (
    <Shell>
      <div style={{ flex: 1, overflowY: "auto", position: "relative" }}>
        {body}
        {toast && (<div style={{ position: "absolute", left: 16, right: 16, bottom: 16, background: C.forestDeep, color: C.cream, padding: "12px 16px", borderRadius: 10, fontSize: 13, textAlign: "center", boxShadow: "0 8px 24px rgba(0,0,0,0.25)" }}>{toast}</div>)}
      </div>
      {!screen && !confirmingLogout && <BottomNav active={tab} onChange={setTab} />}
      {payRoom && <PayPopup r={payRoom} onClose={() => setPayCode(null)} onClaim={async r => { if (await act("claim_payment", { p_code: r.code }, "Thanks! We'll confirm your payment and tell the seller to ship.")) setPayCode(null); }} />}
    </Shell>
  );
}

function Shell({ children }) {
  return (
    <div style={{
      maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: C.cream,
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      display: "flex", flexDirection: "column", color: C.ink,
    }}>
      <StatusGlyph />
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PaperFlow />);
</script>
</body>
</html>
